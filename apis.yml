aid: sion-power
name: Sion Power
description: 'Sion Power Corporation is a Tucson, Arizona lithium-metal battery developer
  and manufacturer, spun out of Brookhaven National Laboratory in 1989. Its Licerion
  platform pairs a protected lithium-metal anode with proprietary electrolyte and cell
  engineering to deliver rechargeable cells with roughly double the gravimetric energy
  density of conventional lithium-ion, targeting defense and aerospace systems, uncrewed
  aircraft, and electrified mobility. The company operates a 115,000-square-foot R&D
  and pilot manufacturing facility, holds more than 430 international patents and
  applications, and has raised over $230 million from investors including LG Energy
  Solution. Sion Power sells physical battery cells under development agreements with
  OEMs; it publishes no developer program, public API, SDK, or machine-readable API
  contract of any kind.'
